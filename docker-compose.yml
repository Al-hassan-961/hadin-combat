#
# Full-stack deployment for the Python-first backend + static frontend.
#
# Honest wiring:
#   * The app has NO code path that reads Redis today, so a Redis service is
#     NOT started (it was previously dead wiring). To add persistence across
#     restarts we bind a named volume to /app/data (history, uploads, JSON
#     preferences).
#   * The image ships the Python-only pipeline (MediaPipe/OpenCV fallback).
#     To enable the optional C++ core, build cpp/ and mount models/*.onnx,
#     then set USE_CPP_CORE=true below.
#
# Usage:  docker-compose up --build   ->  http://localhost:8000
# ---------------------------------------------------------------------------
services:
  backend:
    build:
      context: .
      dockerfile: python-backend/Dockerfile
    image: hadin-combat
    container_name: hadin-backend
    ports:
      - "8000:8000"
    environment:
      - USE_CPP_CORE=${USE_CPP_CORE:-false}
      - FALLBACK_TO_PYTHON=true
      - PORT=8000
      # Optional: uncomment + set to mount pre-trained ONNX models.
      # - POSE_MODEL_PATH=/models/pose.onnx
      # - STYLE_ENCODER_PATH=/models/style_encoder.onnx
      # - OPPONENT_GENERATOR_PATH=/models/opponent_generator.onnx
      # - COEVOLUTION_PATH=/models/coevolution.onnx
    volumes:
      # Persistent session history, uploads + JSON preferences survive restarts.
      - hadin-data:/app/data
      # Read-only model mount (optional; enable the C++/ONNX path):
      # - ./models:/models:ro
      - ./cpp:/app/cpp:ro
    restart: unless-stopped

volumes:
  hadin-data:
