#
# Build configuration. Dependency resolution lives in setup.py.
#
# NOTE: numpy and OpenCV are SYSTEM dependencies (never pip build deps):
#   Termux:  pkg install python-numpy python-opencv clang
#   Ubuntu:  apt install python3-numpy python3-opencv
# They are intentionally absent from install_requires so pip never compiles
# them from source on Android (no ARM64 wheels for Python 3.14 -> ninja
# `highway_qsort` crash). Desktop users: pip install -e ".[native]".
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Metadata is defined in setup.py (keep a single source of truth).
