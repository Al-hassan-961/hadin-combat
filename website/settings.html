<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e27" />
    <title>HADIN-COMBAT · Settings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <header class="topnav" role="banner">
        <a class="brand" href="/" aria-label="HADIN-COMBAT home">
            <span class="brand-mark" aria-hidden="true">🥋</span>
            <span class="brand-text"><h1>HADIN<span class="accent">-COMBAT</span></h1></span>
        </a>
        <nav class="nav-links" aria-label="Primary">
            <a class="nav-link" href="/"><span>🥊</span> Training</a>
            <a class="nav-link" href="/dashboard.html"><span>📈</span> Dashboard</a>
            <a class="nav-link active" href="/settings.html"><span>⚙️</span> Settings</a>
        </nav>
        <div class="brand" style="margin-right:0">
            <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light theme">🌙</button>
        </div>
    </header>

    <main class="page-pad" id="main">
        <section class="hero" style="padding-top:36px;padding-bottom:20px" aria-label="Settings">
            <div class="hero-eyebrow">👤 Athlete profile</div>
            <h1 class="hero-title" style="font-size:clamp(1.7rem,4vw,2.4rem)">Settings &amp; <span class="grad">Preferences</span></h1>
        </section>

        <section class="panel" aria-label="Profile">
            <h2>Profile</h2>
            <label class="field-label" for="profileName">Athlete name</label>
            <input class="file-input" id="profileName" type="text" placeholder="e.g. Al-hassan" autocomplete="name" />
            <div class="card-label" id="backendInfo" style="margin-top:8px">Backend: —</div>
        </section>

        <section class="panel" aria-label="Defaults">
            <h2>Training defaults</h2>
            <label class="switch-row"><span>🔊 Voice coaching on start</span>
                <input type="checkbox" id="optVoice" /><span class="switch" aria-hidden="true"></span></label>
            <label class="switch-row"><span>🪞 Mirror view</span>
                <input type="checkbox" id="optMirror" /><span class="switch" aria-hidden="true"></span></label>
            <label class="switch-row"><span>🦴 Skeleton overlay</span>
                <input type="checkbox" id="optSkeleton" checked /><span class="switch" aria-hidden="true"></span></label>
            <label class="switch-row"><span>👻 Opponent ghost</span>
                <input type="checkbox" id="optGhost" /><span class="switch" aria-hidden="true"></span></label>
        </section>

        <div class="controls" style="position:static">
            <button class="btn btn-primary" id="saveBtn">💾 Save preferences</button>
            <a class="btn btn-ghost" href="/">← Back to training</a>
        </div>
    </main>

    <footer class="app-footer">
        <p>© 2026 Al-hassan Shehade &amp; Dina Balcheh · HADIN-COMBAT</p>
    </footer>

    <script src="js/settings.js"></script>
</body>
</html>
