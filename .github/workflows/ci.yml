name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-build:
    name: Build C++ core (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ libopencv-dev libonnxruntime-dev \
            python3-dev python3-pybind11

      - name: Configure & build
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Verify module exists
        run: ls python-backend/app/hadin_core*.so || ls build/*.so

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # numpy + OpenCV are system dependencies (never pip-built), so the tests
      # run on the system Python with an apt-provided numpy/OpenCV.
      - name: Install system Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv python3-numpy python3-venv python3-pip

      - name: Install project
        run: |
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check python-backend/ || true

      - name: Run tests
        run: |
          source .venv/bin/activate
          cd python-backend
          python -m pytest tests/ -q

  js-lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & lint
        run: |
          npm install --no-audit --no-fund
          node scripts/lint-js.js
